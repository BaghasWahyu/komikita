name: Set up KomiKita Rust
description: Install the Rust Android targets and cargo-ndk used by KomiKita.
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
        rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;29.0.14206865"
    - name: Install cargo-ndk
      shell: bash
      run: cargo +stable install cargo-ndk --version 4.1.2 --locked
