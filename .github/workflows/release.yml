name: Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  KOMIKITA_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/komikita.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github -Penable-updater=true
        env:
          storeFile: ${{ runner.temp }}/komikita.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk komikita-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk komikita-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk komikita-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk komikita-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk komikita-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: komikita
          path: |
            komikita-${{ needs.get_tag.outputs.tag }}.apk
            komikita-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            komikita-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            komikita-x86-${{ needs.get_tag.outputs.tag }}.apk
            komikita-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Build (FOSS)
    runs-on: ubuntu-26.04
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/komikita.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleFoss -Pdist=foss -Penable-updater=true
        env:
          storeFile: ${{ runner.temp }}/komikita.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk komikita-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: komikita-foss
          path: komikita-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build, build_foss]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            komikita
            komikita-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: KomiKita ${{ needs.get_tag.outputs.tag }}
          body: |
            KomiKita — a customizable manga, comic, and webtoon reader for Android.

            Documentation: [English](https://github.com/BaghasWahyu/komikita/blob/main/docs/README.md) · [Bahasa Indonesia](https://github.com/BaghasWahyu/komikita/blob/main/docs/id/README.md)

            Check out the [past release notes](https://github.com/BaghasWahyu/komikita/releases) if you're upgrading from an earlier version.

            <!-->



            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `komikita-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            komikita-${{ needs.get_tag.outputs.tag }}.apk
            komikita-${{ needs.get_tag.outputs.tag }}-foss.apk
            komikita-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            komikita-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            komikita-x86-${{ needs.get_tag.outputs.tag }}.apk
            komikita-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
